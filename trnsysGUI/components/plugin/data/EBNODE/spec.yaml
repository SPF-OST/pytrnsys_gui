  - name: D1
    position: [120, 20]
    direction: out
  - name: D2
    position: [120, 40]
    direction: out
  - name: D3
    position: [120, 60]
    direction: out
  - name: D4
    position: [120, 80]
    direction: out
  - name: D5
    position: [120, 100]
    direction: out
  - name: D6
    position: [120, 120]
    direction: out
  - name: D7
    position: [120, 140]
    direction: out
  - name: D8
    position: [120, 160]
    direction: out
  - name: D9
    position: [120, 180]
    direction: out
  - name: D10
    position: [120, 200]
    direction: out
size: [120, 220]
